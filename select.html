<!DOCTYPE html>
 <html lang="ar" type="text/html">
  <head>
   <!--meta-->
    <meta charset = "utf-8"/>
    <meta name = "theme-color" content = "#422464"/>
    <meta name = "color-scheme" content = "light"/>
    <meta name = "author" content = "Youssef Ibrahim"/>
    <meta name = "google" content = "notranslate"/>
    <meta name = "robots" content = "none"/>
    <meta name = "description" content = "استبيان توظيف للتقدم على وظيفة طبية"/>
    <meta name = "twitter:card" content = "summary"/>
    <meta property = "og:type" content = "website"/>
    <meta property = "og:url" content = "http://localhost/www/Kawader%20Medical/"/>
    <meta property = "og:site_name" content = "mrq"/>
    <meta property = "og:title" content = "Kawader Medical"/>
    <meta property = "og:description" content = "استبيان توظيف للتقدم على وظيفة طبية"/>
    <meta property = "og:image" content = "./assets/images/icon.png"/>
    <meta property = "og:image:alt" content = "Icon"/>
    <!--link-->
     <link rel="canonical" href="http://localhost/www/Kawader%20Medical/"/>
     <link rel="me" href="https://youssefdev.42web.io"/>
     <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico"/>
     <link rel="icon" type="image/png" href="./assets/images/icon.png"/>
     <link rel="stylesheet" type="text/css" href="./assets/css/style.css"/>
     <link rel="stylesheet" media="all" href="./assets/libs/css/fontawesome.css"/>
     <link rel="stylesheet" href="./assets/libs/css/toastr.css"/>
    <!--title-->
     <title>استبيان العمل الطبي</title>
    <!--script-->
     <script src="./assets/libs/js/jquery.js"></script>
     <script src="./assets/libs/js/toastr.js"></script>
     <script type="text/javascript" src="./assets/js/script.js" defer></script>
     <noscript>لفتح الإستبيان (JavaScript) الرجاء فتح الجافا سكريبت</noscript>
   </head>
  <body>
   <!--loading-->
    <div id="loading">
     <!--load-->
      <embed class="load" src="./assets/svg/load.svg"></embed>
    </div>
   <!--resend-->
    <div class="resend" style="display:none">
     <div class="resend-card">
      <p>لديك استبيان مُعبأ سابقاً</p>
      <textarea id="mrqMessage"></textarea>
      <textarea id="mrqMSG"></textarea>
      <span>
       <button type="button" id="copySurvey"><i class="fas fa-copy"></i>نسخ الاستبيان</button>
       <button type="button" id="resendSurvey"><i class="fas fa-paper-plane"></i>إعادة ارسال الاستبيان</button>
      </span>
     </div>
    </div>
   <!--container-->
    <div class="_container">
     <!--header-->
      <header>
       <!--time-->
        <nav class="time">
         <span id="time"></span>
        </nav>
       <!--switch-->
        <button type="button" title="تغيير المظهر" class="switch"></button>
      </header>
     <!--main-->
      <main>
       <!--slidebar-->
        <section class="slidebar">
         <h4>الرجاء الاختيار</h4>
         <!--country-->
          <section class="country">
           <button id="ger" type="button" disabled>المانيا</button>
           <button id="ksa" type="button">المملكة العربية السعودية</button>
           <button id="uae" type="button" disabled>الإمارات العربية المتحدة</button>
           <button id="omn" type="button" disabled>سلطنة عمان</button>
          </section>
         <!--option: ksa-->
          <section class="option ksa">
           <button class="out" id="out-sa" type="button">خارج المملكة</button>
           <button class="in" id="in-sa" type="button">مقيم داخل المملكة</button>
          </section>
        </section>
      </main>
     <!--footer-->
      <footer>
       <p><time></time> جميع الحقوق محفوظة <i class="far fa-copyright"></i></p>
      </footer>
    </div>
  </body>
 </html>
